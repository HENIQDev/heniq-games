<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="キービジュアル：たくさんのカラフルなボールと、逃げる小さな白いキャラクター">
  <defs>
    <pattern id="chk" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#fff3d6"/>
      <rect width="60" height="60" fill="#ffe9b8"/><rect x="60" y="60" width="60" height="60" fill="#ffe9b8"/>
    </pattern>
    <g id="ball"><circle r="1" /></g>
  </defs>
  <rect width="1280" height="720" fill="url(#chk)"/>
  <!-- ボールの軌跡 -->
  <g stroke="#2b2350" stroke-opacity=".12" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M60 80 L520 330"/><path d="M1240 120 L760 330"/><path d="M200 690 L560 440"/><path d="M1100 700 L740 450"/><path d="M640 -20 L640 270"/>
  </g>
  <!-- ボール -->
  <g stroke="#2b2350" stroke-width="8">
    <circle cx="520" cy="330" r="64" fill="#ff4f8b"/><circle cx="760" cy="330" r="50" fill="#2bb6ff"/>
    <circle cx="560" cy="440" r="42" fill="#ffc233"/><circle cx="740" cy="450" r="58" fill="#4cd964"/>
    <circle cx="640" cy="270" r="36" fill="#2bb6ff"/>
    <circle cx="150" cy="120" r="84" fill="#ffc233"/><circle cx="1150" cy="150" r="104" fill="#ff4f8b"/>
    <circle cx="110" cy="610" r="70" fill="#2bb6ff"/><circle cx="1180" cy="600" r="86" fill="#4cd964"/>
  </g>
  <g fill="#fff" fill-opacity=".75">
    <circle cx="500" cy="308" r="17"/><circle cx="743" cy="314" r="13"/><circle cx="548" cy="428" r="11"/><circle cx="722" cy="432" r="15"/><circle cx="631" cy="262" r="9"/>
    <circle cx="125" cy="92" r="22"/><circle cx="1118" cy="112" r="27"/><circle cx="92" cy="586" r="18"/><circle cx="1154" cy="570" r="22"/>
  </g>
  <!-- キャラクター -->
  <g transform="translate(640 380)">
    <ellipse cx="6" cy="40" rx="42" ry="14" fill="#2b2350" fill-opacity=".18"/>
    <circle r="42" fill="#fff" stroke="#2b2350" stroke-width="9"/>
    <g stroke="#2b2350" stroke-width="5"><circle cx="-14" cy="-6" r="12" fill="#fff"/><circle cx="14" cy="-6" r="12" fill="#fff"/></g>
    <circle cx="-11" cy="-4" r="5.5" fill="#2b2350"/><circle cx="17" cy="-4" r="5.5" fill="#2b2350"/>
    <ellipse cx="0" cy="18" rx="7" ry="8" fill="none" stroke="#2b2350" stroke-width="5"/>
  </g>
</svg>
